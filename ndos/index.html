<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="NDOS — Neurodiversity Support & Daily Structure Operating System. A personal productivity tool for ADHD-style support and routine building." />
  <meta name="theme-color" content="#0f1117" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Stylesheet -->
  <link rel="stylesheet" href="ui/ndos.css" />

  <!-- PWA -->
  <link rel="manifest" href="pwa/manifest.json" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="NDOS" />

  <!-- Disclaimer (non-medical) -->
  <!-- This application is NOT a medical device, does NOT diagnose any condition,
       and does NOT replace professional support. For personal organisation only. -->

  <title>NDOS — Daily Structure OS</title>
</head>
<body>

  <div id="ndos-root"></div>

  <script type="module">
    import { mountDashboard } from "./ui/dashboard.js";

    // Mount the NDOS dashboard
    const root = document.getElementById("ndos-root");
    mountDashboard(root);

    // Register service worker
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker
        .register("/ndos/pwa/sw.js", { scope: "/ndos/" })
        .then(() => console.log("[NDOS] Service worker registered"))
        .catch((err) => console.warn("[NDOS] SW registration failed:", err));
    }

    // Handle URL view param (for PWA shortcuts)
    const params = new URLSearchParams(window.location.search);
    const view = params.get("view");
    if (view) {
      import("./ui/dashboard.js").then(({ navigate }) => navigate(view));
    }
  </script>

</body>
</html>
